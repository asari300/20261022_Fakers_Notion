[project]
name = "fakers-notion"
version = "0.1.0"
description = "Fakers Notion — a Notion-like collaborative editor (Python tooling)"
readme = "README.md"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [
    { name = "asari300", email = "nk.mwhrskaomr.93@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
fakers-notion = "fakers_notion:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0,<1.65",   # この RPi に入っている Chromium 1248 に合わせる（GlobeMode と同じ版）
]

[tool.uv.build-backend]
# パッケージは言語別の src/Python/mod/ に置く（CLAUDE.md）
module-name = "fakers_notion"
module-root = "src/Python/mod"
