name = "fakers_web"
version = "0.1.0"
description = "Fakers Notion の SPA（Lustre、JavaScript ターゲット）。yjs と Phoenix の JS は FFI の中だけで触る"
target = "javascript"

[javascript]
runtime = "node"

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
lustre = ">= 5.0.0 and < 6.0.0"
rsvp = ">= 2.0.0 and < 3.0.0"
fakers_shared = { path = "../fakers_shared" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
